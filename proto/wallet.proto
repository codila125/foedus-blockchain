syntax = "proto3";

package wallet;

option go_package = "github.com/codila125/foedus-blockchain/protobuf";

// Wallet represents a single wallet with private and public keys
message Wallet {
    bytes private_key = 1;
    bytes public_key = 2;
}

// Wallets is a collection of wallets
message Wallets {
    map<string, Wallet> wallets = 1;
}

